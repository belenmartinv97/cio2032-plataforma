<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Future CIO Challenge</title>
<style>:root{box-sizing:border-box}*,*::before,*::after{box-sizing:inherit}html{-webkit-text-size-adjust:100%}body{margin:0}</style>
</head><body>
<script src="config.js"></script>
<script src="shim.js"></script>
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Versión sin identificadores de tendencia visibles (T5, T6…) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#020B1D; --bg-soft:#0B2038; --surface:rgba(11,32,56,.66); --surface-2:rgba(17,43,68,.72);
  --ink:#F7F9FC; --ink-2:#B0BDCC; --ink-3:#7F93A8;
  --line:rgba(150,196,255,.15); --line-strong:rgba(150,196,255,.3);
  --t1:#50C4D8; --t1-ink:#50C4D8;
  --t2:#F0A04B; --t2-ink:#F0A04B;
  --t3:#8FA8FF; --t3-ink:#A9BCFF;
  --t4:#A6E22E; --t4-ink:#A6E22E;
  --focus:#A6E22E;
  --header-bg:rgba(2,11,29,.62);
  --shadow:0 18px 40px -22px rgba(0,0,0,.7);
  --font-ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-read:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F2F5F8; --bg-soft:#E4EAF2; --surface:#FFFFFF; --surface-2:#F6F8FB;
  --ink:#0A1B35; --ink-2:#38496A; --ink-3:#62758F;
  --line:#D5DDE8; --line-strong:#B3C0D3;
  --t1:#1F6FD6; --t1-ink:#1556AD;
  --t2:#C28A12; --t2-ink:#80590A;
  --t3:#A63C82; --t3-ink:#8A2B6A;
  --t4:#7DB223; --t4-ink:#3B690A;
  --focus:#2B6CF0;
  --header-bg:rgba(242,245,248,.9);
  --shadow:0 1px 2px rgba(10,27,53,.06),0 18px 40px -20px rgba(10,27,53,.22);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--header-bg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
h1,h2,h3,p,ul,ol,figure,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
#app{outline:none}
.wrap{max-width:1240px;margin:0 auto;padding-inline:clamp(18px,4vw,48px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.t1{--c:var(--t1);--c-ink:var(--t1-ink)}
.t2{--c:var(--t2);--c-ink:var(--t2-ink)}
.t3{--c:var(--t3);--c-ink:var(--t3-ink)}
.t4{--c:var(--t4);--c-ink:var(--t4-ink)}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--header-bg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:650;letter-spacing:-.01em;font-size:1.02rem}
.brand svg{width:26px;height:26px;flex:none}
.nav{display:flex;align-items:center;gap:4px}
.nav a,.nav button.ic{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border-radius:999px;text-decoration:none;font-size:.95rem;font-weight:500;color:var(--ink-2);background:none;border:0}
.nav a:hover,.nav button.ic:hover{color:var(--ink);background:var(--bg-soft)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--bg-soft)}
.save{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;color:var(--ink-3);padding:0 10px;white-space:nowrap}
.save i{width:8px;height:8px;border-radius:50%;background:var(--line-strong);flex:none}
.save[data-s="shared"] i{background:var(--t4)}
.save[data-s="pending"] i{background:var(--t2)}
.save[data-s="error"] i{background:var(--t3)}
.gprog{height:2px;background:transparent}
.gprog i{display:block;height:100%;width:0;background:var(--ink);transition:width .5s cubic-bezier(.2,.7,.2,1)}
@media (max-width:640px){.wsname,.phase{display:none}.save b{display:none}.nav a{padding:0 9px}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 22px;border-radius:14px;border:1px solid var(--line-strong);background:transparent;font-weight:600;font-size:.98rem;text-decoration:none;transition:background .2s,border-color .2s,color .2s}
.btn:hover{border-color:var(--ink)}
.btn-primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-primary:hover{background:var(--ink-2);border-color:var(--ink-2)}
.btn-lg{min-height:56px;padding:0 30px;font-size:1.05rem;border-radius:16px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn-text{border:0;padding:0 6px;min-height:40px;color:var(--ink-2)}
.btn-text:hover{color:var(--ink);background:var(--bg-soft)}

/* Pages */
.page{padding-block:clamp(24px,4vw,56px) 96px}
.page-head{max-width:760px;margin-bottom:clamp(24px,3vw,44px)}
.page-head h1{font-size:clamp(2rem,4.6vw,3.4rem);line-height:1.02;letter-spacing:-.03em;font-weight:700;font-stretch:90%}
.page-head h1.h-q{font-size:clamp(1.7rem,3.4vw,2.6rem);line-height:1.08;max-width:24ch}
.lead{margin-top:14px;font-family:var(--font-read);font-size:1.22rem;line-height:1.55;color:var(--ink-2);max-width:60ch}
.back{display:flex;width:fit-content;align-items:center;gap:8px;min-height:40px;margin-bottom:12px;text-decoration:none;font-weight:500;color:var(--ink-2)}
.back:hover{color:var(--ink)}
.back svg{width:16px;height:16px}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(24px,5vw,88px);align-items:center;padding-block:clamp(24px,5vw,72px) 96px;min-height:calc(100vh - 140px)}
.hero h1{font-size:clamp(2.8rem,7vw,6rem);line-height:.94;letter-spacing:-.04em;font-weight:700;font-stretch:82%}
.hero-sub{margin-top:22px;font-family:var(--font-read);font-style:italic;font-size:clamp(1.2rem,2.2vw,1.6rem);line-height:1.35;color:var(--ink-2);max-width:30ch}
.hero-body{margin-top:22px;font-family:var(--font-read);font-size:1.12rem;line-height:1.65;color:var(--ink-2);max-width:52ch}
.hero-cta{margin-top:32px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.facts{margin-top:30px;display:grid;gap:10px;max-width:52ch;font-size:.95rem;color:var(--ink-2)}
.facts p{display:flex;gap:12px;align-items:flex-start}
.facts svg{width:18px;height:18px;flex:none;margin-top:3px;color:var(--ink-3)}
.hero-viz{position:relative}
.hero-viz svg{display:block;width:100%;height:auto;max-height:78vh;overflow:visible}
.cap-line{min-height:3.2em;margin-top:6px;text-align:center;color:var(--ink-2);font-size:.98rem;max-width:44ch;margin-inline:auto}
.cap-line b{color:var(--ink)}
.legend{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lg{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:14px;text-decoration:none;border:1px solid transparent;font-size:.9rem;line-height:1.3;color:var(--ink-2)}
.lg:hover,.lg:focus-visible{border-color:var(--line-strong);color:var(--ink)}
.lg i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;margin-top:3px}
.lg small{display:block;color:var(--ink-3);font-size:.82rem}
@media (max-width:900px){.hero{grid-template-columns:1fr;min-height:0;padding-bottom:64px}.legend{grid-template-columns:1fr}}
.sec{transition:opacity .25s}
.nd{transform-box:fill-box;transform-origin:center;animation:ndIn .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*45ms + 120ms)}
@keyframes ndIn{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.hero-viz[data-focus="1"] .sec:not(.s1),.hero-viz[data-focus="2"] .sec:not(.s2),.hero-viz[data-focus="3"] .sec:not(.s3),.hero-viz[data-focus="4"] .sec:not(.s4){opacity:.2}

/* Modal + toast */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(5,10,13,.55);display:grid;place-items:center;padding:20px}
.dlg{width:min(520px,100%);background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow)}
.dlg h2{font-size:1.4rem;letter-spacing:-.02em}
.dlg p{margin-top:10px;font-family:var(--font-read);font-size:1.08rem;color:var(--ink-2)}
.dlg .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;justify-content:flex-end}
.dlg textarea{width:100%;margin-top:14px;min-height:180px;font:.82rem/1.45 ui-monospace,Menlo,Consolas,monospace;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);padding:12px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;pointer-events:none;z-index:70;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:500;font-size:.95rem;transition:opacity .25s,transform .25s;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* Map */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1000px){.tiles.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.tiles.three{grid-template-columns:1fr}}
.map-sub{display:grid;gap:4px;margin-top:10px;color:var(--ink-2);font-size:1.05rem}
.map-sub b{color:var(--ink)}
.cap-head{margin-top:clamp(32px,5vw,64px)}
@media (max-width:760px){.tiles{grid-template-columns:1fr}}
.tile{position:relative;border:1px solid var(--line);border-radius:26px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;transition:border-color .25s}
.tile:hover,.tile:focus-within{border-color:var(--c)}
.tile-link{display:flex;flex-direction:column;flex:1;text-decoration:none;color:inherit}
.tile .art{height:160px;color:var(--c);background:color-mix(in srgb,var(--c) 9%,var(--surface));border-bottom:1px solid color-mix(in srgb,var(--c) 22%,var(--line))}
.tile .art svg{display:block;width:100%;height:100%}
.tile-body{padding:22px 24px 22px;display:flex;gap:18px;justify-content:space-between;align-items:flex-end;flex:1}
.tile-body h2{font-size:1.32rem;line-height:1.15;letter-spacing:-.02em;font-weight:650;max-width:22ch}
.tile-num{display:block;font-size:.95rem;font-weight:600;color:var(--c-ink);margin-bottom:6px}
.tile-meta{margin-top:10px;color:var(--ink-2);font-size:.95rem}
.tile-meta b{color:var(--ink);font-weight:600}
.tile-meta+.tile-meta{margin-top:2px}
.tile-cta{margin-top:12px;font-weight:650;font-size:.95rem;color:var(--c-ink)}
.ring{width:64px;height:64px;flex:none}
.tile-extra{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;border-top:1px solid var(--line);text-decoration:none;font-weight:600;font-size:.95rem;background:color-mix(in srgb,var(--c) 7%,var(--surface))}
.tile-extra:hover{background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.map-foot{margin-top:32px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:22px 26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}
.map-foot p{font-family:var(--font-read);font-size:1.08rem;color:var(--ink-2);max-width:56ch}

/* Territory workspace */
.work{display:grid;grid-template-columns:minmax(280px,370px) minmax(0,1fr);gap:clamp(20px,3.4vw,56px);align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.rail h1{font-size:clamp(1.5rem,2.4vw,2rem);line-height:1.1;letter-spacing:-.025em;font-weight:700}
.rail-n{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--c-ink);margin-bottom:8px}
.rail-n i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.rail-prog{margin-top:10px;font-size:.95rem;color:var(--ink-2)}
.segs{display:flex;gap:4px;margin-top:12px}
.segs i{flex:1;height:5px;border-radius:3px;background:var(--line-strong)}
.segs i.on{background:var(--c)}
.rail-list{margin-top:22px;position:relative}
.rail-list li{position:relative}
.rail-list li:not(:last-child)::after{content:"";position:absolute;left:15px;top:38px;bottom:-4px;width:2px;background:var(--line)}
.nd-row{width:100%;display:grid;grid-template-columns:32px 1fr;gap:14px;align-items:start;text-align:left;padding:10px 12px 10px 0;border:0;background:none;border-radius:14px;min-height:56px}
.nd-row:hover .nd-title{color:var(--c-ink)}
.nd-dot{width:32px;height:32px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;position:relative;z-index:1;color:var(--c-ink)}
.nd-dot svg{width:18px;height:18px}
.nd-row.done .nd-dot{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.nd-row.cur{background:color-mix(in srgb,var(--c) 8%,transparent)}
.nd-row.cur .nd-dot{border-color:var(--ink)}
.nd-row.pr{box-shadow:inset 3px 0 0 var(--c);padding-left:10px;background:color-mix(in srgb,var(--c) 7%,transparent)}
.nd-row.pr.cur{background:color-mix(in srgb,var(--c) 14%,transparent)}
.nd-row.pr .nd-dot{background:color-mix(in srgb,var(--c) 32%,var(--surface));border-color:var(--c);color:var(--c-ink)}
.nd-row.pr .nd-dot svg{fill:currentColor}
.nd-pill{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;font-size:.74rem;font-weight:700;color:var(--c-ink);border:1px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.nd-title{font-weight:600;line-height:1.25;font-size:.98rem}
.nd-id{font-weight:700;color:var(--c-ink);margin-right:6px}
.nd-sub{display:block;margin-top:3px;font-size:.84rem;color:var(--ink-3)}
.decide-sub{margin-top:8px;max-width:58ch;color:var(--ink-2);font-size:.95rem}
.tile-sub{margin-top:8px;color:var(--ink-2);font-size:.9rem;line-height:1.35;max-width:28ch}
.tile-sub b{color:var(--ink)}
.own-trends{margin-top:18px;display:grid;gap:16px}
.nd-row.extra .nd-dot{border-style:dashed}
.own-trends .own-box{margin-top:0}
.own-card{padding:clamp(16px,2.4vw,26px);border-radius:22px;border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));background:color-mix(in srgb,var(--c) 5%,var(--surface))}
.own-card header{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.own-card header>div{min-width:0}
.own-card h3{font-size:1.2rem;line-height:1.25;overflow-wrap:anywhere}
.oc-tag{display:inline-block;margin-bottom:4px;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.decide.mini{margin-top:16px;padding:16px;border-radius:18px}
.decide.mini h4{font-size:1rem;line-height:1.3;font-weight:650}
.decide.mini .opts{margin-top:12px}
.own-card .cm-l{display:block;margin-top:16px}
.prio-foot{margin-top:clamp(28px,4vw,48px);width:100%;padding:clamp(22px,3vw,36px);border-radius:24px;border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));background:color-mix(in srgb,var(--c) 9%,var(--surface));display:grid;gap:10px;justify-items:start}
.prio-foot h2{font-size:clamp(1.3rem,2.2vw,1.7rem);line-height:1.2;letter-spacing:-.02em;max-width:34ch}
.prio-foot p{color:var(--ink-2);max-width:60ch}
.prio-foot .pf-cur{color:var(--ink);font-weight:600}
.ficha .prio-foot{margin-top:26px;width:auto;padding:14px 18px;border-radius:16px;border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));background:transparent;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 18px}
.ficha .prio-foot h2{font-size:1.02rem;line-height:1.3;letter-spacing:-.01em;max-width:none;flex:1 1 260px;margin:0}
.ficha .prio-foot .btn{flex:0 0 auto}
.wnote{margin:0 0 12px;color:var(--ink-2);font-size:.92rem}
.cand .cx{grid-column:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 16px;margin-top:8px;color:var(--ink-3);font-size:.85rem}
.cand .cx>span{display:grid;gap:5px;align-content:start}
.cand .cx small{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;font-weight:600}
.cand .cx b{color:var(--ink);font-weight:650}
.cand .cx span.bar{height:6px;border-radius:3px;background:var(--bg-soft);overflow:hidden;display:block}
.cand .cx span.bar i{display:block;height:100%;width:var(--w);background:var(--c)}
.cand .cx span.bar.none i{background:repeating-linear-gradient(135deg,var(--line-strong) 0 3px,transparent 3px 6px);width:100%}
@media (max-width:520px){.cand .cx{grid-template-columns:repeat(2,minmax(0,1fr))}}
.vis-fig{position:relative}
.vtip{position:absolute;z-index:20;width:min(300px,calc(100% - 8px));max-height:320px;overflow:auto;padding:14px 16px;border-radius:16px;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);box-shadow:0 14px 34px rgba(0,0,0,.28)}
.vtip[hidden]{display:none}
.vtip h3{font-size:1rem;line-height:1.25;margin:0 0 8px}
.vtip dl{display:grid;gap:4px;margin:0}
.vtip dl div{display:flex;justify-content:space-between;gap:12px;font-size:.88rem}
.vtip dt{color:var(--ink-3)}
.vtip dd{margin:0;font-weight:650;text-align:right}
.vtip .vt-pr{margin-top:8px;font-size:.85rem;font-weight:600}
.vtip blockquote{margin:10px 0 0;padding:8px 10px;border-radius:10px;background:var(--bg-soft);font-size:.9rem;color:var(--ink-2);overflow-wrap:anywhere}
.vtip p{margin-top:10px;font-size:.88rem}
.rail-cta{margin-top:20px;padding:18px;border-radius:18px;border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.rail-cta p{font-family:var(--font-read);font-size:1.02rem;color:var(--ink-2);margin-bottom:12px}
.main .empty{border:1px dashed var(--line-strong);border-radius:28px;padding:clamp(28px,5vw,64px);text-align:center;color:var(--ink-2);display:grid;gap:18px;justify-items:center}
.main .empty .art{width:100%;max-width:560px;height:170px;border-radius:14px;overflow:hidden;color:var(--c);background:color-mix(in srgb,var(--c) 8%,transparent);border:1px solid color-mix(in srgb,var(--c) 22%,var(--line))}
.main .empty .art svg{display:block;width:100%;height:100%}
.main .empty p{font-family:var(--font-read);font-size:1.15rem;max-width:36ch}
@media (max-width:900px){
  .work{grid-template-columns:1fr}
  .rail{position:static}
  .work.has-trend .rail{display:none}
  .work:not(.has-trend) .main{display:none}
}

/* Ficha */
.ficha{background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:clamp(22px,3.4vw,48px);box-shadow:var(--shadow)}
.mback{display:none}
@media (max-width:900px){.mback{display:flex}}

/* Prioridad */
.prio{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(22px,4vw,64px);align-items:start}

  var map={pending:["pending","Guardando…"], shared:["shared","Guardado"], local:["local","Solo en este navegador"], error:["error","Solo en este navegador"]};
  var m=map[kind]||map.local; el.setAttribute("data-s", m[0]);
  var b=$("b", el); if(b) b.textContent=m[1];
  el.title = kind==="shared" ? "Tus respuestas están guardadas en el servidor y se recuperan con tu enlace personal." :
             kind==="pending" ? "Guardando tus cambios…" :
             kind==="error" ? "No se pudo guardar en el espacio compartido. Tu progreso sigue en este navegador." :
             "No se ha podido conectar con el servidor. Tu progreso se guarda solo en este navegador.";
}
function touch(){
  var t=nowIso(); if(!state.startedAt) state.startedAt=t; state.updatedAt=t;
  lsSave(); dirty=true; setSave(store.ref? "pending":"local");
  clearTimeout(saveTimer); saveTimer=setTimeout(flush, 700);
  updateChrome();
}
function serialize(){
  return JSON.parse(JSON.stringify({v:1, profile:state.profile, pid:state.pid, startedAt:state.startedAt, updatedAt:state.updatedAt, ratings:state.ratings, certainty:state.certainty, comments:state.comments, priorities:state.priorities, caps:state.caps, own:state.own, finalizedAt:state.finalizedAt, last:state.last}));
}
function flush(){
  if(!store.ref){ setSave("local"); return Promise.resolve(); }
  if(saving){ dirty=true; return Promise.resolve(); }
  saving=true; dirty=false;
  return store.ref.set(serialize()).then(function(){
    saving=false; store.mode="shared"; setSave("shared");
    if(dirty) return flush();
  }).catch(function(e){
    saving=false;
    var code = e && e.code;
    if(code==="invalid_argument" || code==="not_granted" || code==="revoked"){ store.ref=null; store.mode="local"; setSave("local"); updateStoreNote(); }
    else { setSave("error"); dirty=true; setTimeout(function(){ if(dirty) flush(); }, 6000); }
  });
}

var GEO = (function(){
  var gap=9, per=(360-3*gap)/19, a=-90+gap/2, nodes={}, sectors=[];
  for(var i=0;i<3;i++){
    var t=TERRITORIES[i], a0=a;
    t.trends.forEach(function(id,k){ nodes[id]={ang:a0+(k+0.5)*per, t:t.n}; });
    a += t.trends.length*per;
    sectors.push({n:t.n, a0:a0, a1:a});
    a += gap;
  }
  return {nodes:nodes, sectors:sectors};
})();

    if(!r) s+='<circle class="vk" cx="'+f1(p[0])+'" cy="'+f1(p[1])+'" r="4.5" fill="var(--line-strong)"/>';
    else if(r==="sin-info") s+='<circle class="vk" cx="'+f1(p[0])+'" cy="'+f1(p[1])+'" r="10" fill="none" stroke="var(--ink-3)" stroke-width="2" stroke-dasharray="3 3.5"/>';
    else {
      var kk=state.certainty[id], cx=f1(p[0]), cy=f1(p[1]), rr=radii[r];
      if(kk==="bajo") s+='<circle class="vk" cx="'+cx+'" cy="'+cy+'" r="'+rr+'" fill="none" stroke="var(--c)" stroke-width="2.4" stroke-dasharray="4 3"/>';
      else if(kk==="medio-bajo") s+='<circle class="vk" cx="'+cx+'" cy="'+cy+'" r="'+rr+'" fill="var(--c)" fill-opacity=".28" stroke="var(--c)" stroke-width="2"/>';
      else if(kk==="medio-alto") s+='<circle class="vk" cx="'+cx+'" cy="'+cy+'" r="'+rr+'" fill="var(--c)" fill-opacity=".62" stroke="var(--c)" stroke-width="2"/>';
      else s+='<circle class="vk" cx="'+cx+'" cy="'+cy+'" r="'+rr+'" fill="var(--c)"/>';
    }
        s+='</g>';
  });
  return s+'</svg>';
}

/* ===================== router ===================== */
function route(){
  var h=(location.hash||"").replace(/^#/,""), m;
  if(!h||h==="inicio") return {name:"inicio"};
  if(h==="mapa") return {name:"mapa"};
  if((m=h.match(/^bloque-([1-3])$/))) return {name:"bloque", n:+m[1], auto:true};
  if((m=h.match(/^lista-([1-3])$/))) return {name:"bloque", n:+m[1]};
  if((m=h.match(/^bloque-4$/))) return {name:"capacidades"};
  if((m=h.match(/^propuesta-([1-3])$/))) return {name:"bloque", n:+m[1], own:true};
  if((m=h.match(/^tendencia-(\d{1,2})$/))){ var id="T"+m[1]; if(TITLES[id]) return {name:"bloque", n:terrOf(id).n, trend:id}; }
  if((m=h.match(/^prioridad-([1-3])$/))) return {name:"prioridad", n:+m[1]};
  if(h==="capacidades") return {name:"capacidades"};
  if(h==="vision") return {name:"vision"};
  if(h==="equipo") return {name:"equipo"};
  if(h==="registro") return {name:"registro"};
  return {name:"inicio"};
}

function tileHtml(t){
  var n=t.n, done, total, segs, status, cta, extra="";

    status = done===0? "Sin empezar" : (done<total? '<b>'+done+' de '+total+'</b> revisadas' : '<b>Dimensión completa</b>');
    cta = done===0? "Explorar" : (done<total? "Continuar" : "Revisar");
    if(done===total){
      var pr=state.priorities[n];

    }
  } else {
    done=capCount(state); total=Math.max(done,1); segs=Math.min(Math.max(done,1),6);

function nextAfter(id){

    var n=c.alta+c.moderada+c.limitada+c.nula, total=n+c["sin-info"], mean=null, sd=null;
    if(n){ var sm=0; LEVELS.forEach(function(l){ sm+=l.score*c[l.id]; }); mean=sm/n; var vq=0; LEVELS.forEach(function(l){ if(l.score>0) vq+=c[l.id]*Math.pow(l.score-mean,2); }); sd=Math.sqrt(vq/n); }

    r.cm= r.cn? cs/r.cn : null;

  });
  var capBase=all.filter(function(p){return p.st.caps.confirmed;}).length, cnt={}, own=[];

function fmtPct(v){ return (Math.round(v*10)/10).toFixed(1).replace(".",",")+" %"; }

function icSort(a,b){ return b.mean-a.mean || b.cm-a.cm || b.total-a.total; }
function vImp(r){ return LEVELS.filter(function(l){return l.score>0;}).map(function(l){ return l.short+" "+r.c[l.id]; }).join(" · "); }

function icSvg(rows){
  var W=700,H=560,L=64,R=24,T=26,B=60, pw=W-L-R, ph=H-T-B;
  function X(m){ return L+(m-1)/3*pw; } function Y(c){ return T+(4-c)/3*ph; }
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Mapa de tendencias: impacto frente a certidumbre">';
  s+='<rect x="'+L+'" y="'+T+'" width="'+pw+'" height="'+ph+'" fill="none" stroke="var(--line)"/>';
  s+='<rect x="'+X(MID)+'" y="'+T+'" width="'+(pw/2)+'" height="'+(ph/2)+'" fill="color-mix(in srgb,var(--t4) 10%,transparent)"/>';
  s+='<line x1="'+X(MID)+'" y1="'+T+'" x2="'+X(MID)+'" y2="'+(T+ph)+'" stroke="var(--line-strong)" stroke-dasharray="3 5"/><line x1="'+L+'" y1="'+Y(MID)+'" x2="'+(L+pw)+'" y2="'+Y(MID)+'" stroke="var(--line-strong)" stroke-dasharray="3 5"/>';
  s+='<text class="qt" x="'+(L+pw-10)+'" y="'+(T+20)+'" text-anchor="end">'+QUAD.AA.n+'</text><text class="qt" x="'+(L+pw-10)+'" y="'+(T+ph-12)+'" text-anchor="end">'+QUAD.AB.n+'</text><text class="qt" x="'+(L+10)+'" y="'+(T+20)+'">'+QUAD.BA.n+'</text><text class="qt" x="'+(L+10)+'" y="'+(T+ph-12)+'">'+QUAD.BB.n+'</text>';
  [[1,"1 · Nada"],[2,"2 · Poco"],[3,"3 · Bastante"],[4,"4 · Mucho"]].forEach(function(v){ s+='<text x="'+X(v[0])+'" y="'+(T+ph+20)+'" text-anchor="middle">'+v[1]+'</text>'; });
  [[1,"1 · Bajo"],[2,"2"],[3,"3"],[4,"4 · Alto"]].forEach(function(v){ s+='<text x="'+(L-10)+'" y="'+(Y(v[0])+4)+'" text-anchor="end">'+v[1]+'</text>'; });
  s+='<text x="'+(L+pw/2)+'" y="'+(H-10)+'" text-anchor="middle">Impacto percibido en el rol del CIO (media de los votos)</text><text transform="translate(16 '+(T+ph/2)+') rotate(-90)" text-anchor="middle">Grado de certidumbre (media de los votos)</text>';
  var pts=rows.filter(function(r){return r.mean!=null && r.cm!=null;}).map(function(r){ return {r:r, x:X(r.mean), y:Y(r.cm), rad:Math.min(20, 8+2.2*Math.sqrt(r.total))}; });
  for(var it=0;it<60;it++){ var moved=false;
    for(var i=0;i<pts.length;i++) for(var j=i+1;j<pts.length;j++){ var a=pts[i], b=pts[j], dx=b.x-a.x, dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy), min=a.rad+b.rad+2;
      if(d<min){ moved=true; if(d<.01){ dx=1; dy=0; d=1; } var k=(min-d)/2/d; a.x-=dx*k; a.y-=dy*k; b.x+=dx*k; b.y+=dy*k; } }
    pts.forEach(function(p){ p.x=Math.max(L+p.rad,Math.min(L+pw-p.rad,p.x)); p.y=Math.max(T+p.rad,Math.min(T+ph-p.rad,p.y)); });

  var t=e.target, kind=t.getAttribute&&t.getAttribute("data-input");
  if(kind==="comment"){ var id=t.getAttribute("data-trend"); clearTimeout(cmT); cmT=setTimeout(function(){ setComment(id, t.value); }, 500); }
  else if(kind==="csearch"){ ui.adm.cq=t.value; var l=$("#clist"); if(l) l.innerHTML=commentListHtml(calc(admAll())); }
  else if(kind==="cap-custom"){ ui.capCustom=t.value; }
  else if(kind==="tr-custom"){ ui.trCustom=ui.trCustom||{}; ui.trCustom[t.getAttribute("data-n")]=t.value; }
  else if(kind==="own-comment"){ var oo=(state.own[+t.getAttribute("data-n")]||[])[+t.getAttribute("data-i")]; if(oo){ if(t.value.trim()) oo.m=t.value.slice(0,800); else delete oo.m; clearTimeout(cmT); cmT=setTimeout(touch,500); } }
  else if(kind==="reg-first"){ ui.reg.first=t.value; }
  else if(kind==="reg-last"){ ui.reg.last=t.value; }
});
document.addEventListener("keydown", function(e){ var t=e.target; if(e.key==="Enter" && t.getAttribute && t.getAttribute("data-input")==="cap-custom"){ e.preventDefault(); addCustomCap(); } if(e.key==="Enter" && t.getAttribute && t.getAttribute("data-input")==="tr-custom"){ e.preventDefault(); addOwnTrend(+t.getAttribute("data-n")); } });
document.addEventListener("focusout", function(e){
  var t=e.target; if(t.getAttribute && t.getAttribute("data-input")==="comment"){ clearTimeout(cmT); setComment(t.getAttribute("data-trend"), t.value); }
});
function heroSelDim(){
  var v=ui.heroSel||""; if(!v) return 0;
  if(v.charAt(0)==="d") return +v.slice(1);
  if(v.charAt(0)==="c") return 4;
  var id=v.slice(2); for(var i=0;i<3;i++) if(TERRITORIES[i].trends.indexOf(id)>-1) return i+1;
  return 0;
}
function heroPick(v){
  ui.heroSel=(ui.heroSel===v)? "" : v;
  var fig=$(".hero-viz"); if(!fig) return;
  fig.innerHTML=heroSvg(); fig.setAttribute("data-focus", heroSelDim()||"");
}
document.addEventListener("click", function(e){
  var fig=e.target.closest&&e.target.closest(".hero-viz"); if(!fig) return;
  var p=e.target.closest("[data-pick]");
  if(p) heroPick(p.getAttribute("data-pick")); else if(ui.heroSel) heroPick(ui.heroSel);
});
document.addEventListener("keydown", function(e){
  if(e.key!=="Enter" && e.key!==" ") return;
  var p=e.target.closest&&e.target.closest(".hero-viz [data-pick]"); if(!p||p.tagName==="g") return;
  e.preventDefault(); heroPick(p.getAttribute("data-pick"));
});
function heroFocus(n){
  var fig=$(".hero-viz"); if(!fig) return;
  fig.setAttribute("data-focus", n||heroSelDim()||"");
  var cap=$("#heroCap"); if(!cap) return;
  if(!n){ cap.textContent="Las tres dimensiones exteriores agrupan las 19 tendencias. La interior reúne las capacidades del CIO."; return; }
  var t=TERRITORIES[n-1];
  cap.innerHTML='<b>'+esc(t.name)+'</b><br>'+(n<4? t.trends.length+" tendencias" : "6 macrocapacidades");
}
document.addEventListener("mouseover", function(e){
  var h=e.target.closest&&e.target.closest("[data-hero]"); if(h) heroFocus(+h.getAttribute("data-hero"));
  var c=e.target.closest&&e.target.closest(".hexg"); if(c && !state.caps.confirmed){ var id=c.getAttribute("data-id"); var p=$("#capPanel"); if(p && p.getAttribute("data-h")!==id){ p.setAttribute("data-h",id); p.innerHTML=capPanelHtml(id); } }
  var dt=e.target.closest&&e.target.closest("[data-dot]"); if(dt) scatCap(dt.getAttribute("data-dot"));
  var di=e.target.closest&&e.target.closest("[data-idot]"); if(di){ var ce=$("#scap"); if(ce) ce.textContent=icCap(di.getAttribute("data-idot")); }
});
document.addEventListener("mouseout", function(e){
  var h=e.target.closest&&e.target.closest("[data-hero]"); if(h && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest("[data-hero]"))) heroFocus(0);
});
document.addEventListener("focusin", function(e){
  var h=e.target.closest&&e.target.closest("[data-hero]"); if(h) heroFocus(+h.getAttribute("data-hero"));
  var dt=e.target.closest&&e.target.closest("[data-dot]"); if(dt) scatCap(dt.getAttribute("data-dot"));
  var di=e.target.closest&&e.target.closest("[data-idot]"); if(di){ var ce=$("#scap"); if(ce) ce.textContent=icCap(di.getAttribute("data-idot")); }
  var c=e.target.closest&&e.target.closest(".hexg"); if(c){ var p=$("#capPanel"); var id=c.getAttribute("data-id"); if(p){ p.setAttribute("data-h",id); p.innerHTML=capPanelHtml(id); } }
});
function scatCap(id){
  var el=$("#scap"); if(!el) return; var r=calc(admAll()).rows.filter(function(x){return x.id===id;})[0]; if(!r) return;
  el.textContent=TITLES[id]+". Impacto "+(r.mean==null?"sin datos":r.mean.toFixed(2))+", desacuerdo "+(r.sd==null?"sin datos":r.sd.toFixed(2))+", "+r.n+" valoraciones con criterio.";
}
window.addEventListener("hashchange", function(){ render(); });
window.addEventListener("pageshow", function(){ updateChrome(); });

/* tema */
var THEME_KEY="fcc.theme";
function toggleTheme(){
  var root=document.documentElement, cur=root.getAttribute("data-theme");
  if(!cur) cur = "dark";
  var nx = cur==="dark"? "light":"dark"; root.setAttribute("data-theme", nx);
  try{ localStorage.setItem(THEME_KEY, nx); }catch(e){}
}
(function(){ try{ var t=localStorage.getItem(THEME_KEY); if(t==="dark"||t==="light") document.documentElement.setAttribute("data-theme", t); }catch(e){} })();

/* ===================== dashboard: lectura en tiempo real ===================== */
function admSubscribe(){
  var A=ui.adm;
  if(A.sub || !store.db || !store.canEdit) return;
  A.loading=true; A.slow=false;
  var to=setTimeout(function(){ if(A.loading){ A.slow=true; if(route().name==="equipo") render({keep:true}); } }, 10000);
  try{
    A.sub = store.db.collection("responses").onSnapshot(function(snap){
      clearTimeout(to); A.loading=false; A.slow=false; A.err=null;
      A.raw = snap.docs.map(function(d){ return {id:d.id, data:d.data()||{}}; }); A.real = buildReal(A.raw);
      if(route().name==="equipo") render({keep:true});
    }, function(err){
      clearTimeout(to); A.loading=false; A.err=(err&&err.code)||"unavailable"; A.sub=null;
      if(route().name==="equipo") render({keep:true});
    });
  }catch(e){ A.loading=false; A.err="unavailable"; }
}

/* ===================== arranque ===================== */
function withTimeout(p, ms){ return new Promise(function(res, rej){ var t=setTimeout(function(){ rej({code:"unavailable"}); }, ms); p.then(function(v){ clearTimeout(t); res(v); }, function(e){ clearTimeout(t); rej(e); }); }); }
function init(){
  state = normalizeState(lsLoad());
  setSave("local"); updateStoreNote();
  render();
  function ready(){ store.ready=true; updateChrome(); if(route().name==="equipo") render({keep:true}); }
  if(!window.claude || typeof window.claude.use!=="function"){ ready(); return; }
  var c=window.claude;
  Promise.all([ c.use("db").catch(function(){return null;}), c.use("user").catch(function(){return null;}), c.use("downloads").catch(function(){return null;}) ]).then(function(r){
    var db=r[0], user=r[1]; store.downloads=r[2];
    if(!user){ ready(); return; }
    return Promise.all([ user.id(), user.can("data.write"), user.canEdit() ]).then(function(u){
      store.uid=u[0]; store.canEdit=!!u[2]; store.db=db; ready();
      if(!db || !store.uid || u[1]===false){ updateStoreNote(); return; }
      var ref=db.doc("responses/"+store.uid);
      function tryGet(){ return withTimeout(ref.get(), 10000).then(function(snap){
        store.ref=ref;
        if(snap.exists){
          var remote=normalizeState(snap.data()), lt=state.updatedAt||"", rt=remote.updatedAt||"";
          if(rt>lt){ remote.last = state.last || remote.last; if(!remote.profile && state.profile){ remote.profile=state.profile; remote.pid=state.pid; dirty=true; } state=remote; lsSave(); render({keep:true}); if(dirty) flush(); }
          else if(lt>rt){ dirty=true; flush(); }
        } else if(state.startedAt){ flush(); }
        store.mode="shared"; setSave("shared"); updateStoreNote();
      }).catch(function(){ store.ref=null; setSave("local"); updateStoreNote(); setTimeout(tryGet, 8000); }); } return tryGet();
    });
  }).catch(function(){ updateStoreNote(); }).then(ready);
}
init();
})();
